<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Çok Kritik Hayat Testi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #07070b;
      color: #ffffff;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      overflow: hidden;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: #13131c;
      border: 1px solid #262638;
      border-radius: 20px;
      padding: 32px 22px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.75);
      position: relative;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 10px;
      color: #f8fafc;
    }

    p.sub {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 26px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    button.choice {
      width: 100%;
      padding: 16px 14px;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.4;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      color: #ffffff;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button.choice:active {
      transform: scale(0.96);
    }

    .btn-green {
      background: #16a34a;
      box-shadow: 0 8px 24px rgba(22, 163, 74, 0.35);
    }

    .btn-red {
      background: #dc2626;
      box-shadow: 0 8px 24px rgba(220, 38, 38, 0.35);
    }

    .result {
      display: none;
      margin-top: 8px;
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }

    .result-text {
      font-size: 20px;
      line-height: 1.5;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .sub-roast {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 24px;
      font-style: italic;
    }

    button.back {
      background: #28283a;
      color: #ffffff;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      position: relative;
      transition: transform 0.15s ease;
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="menu">
      <h1>Zeka ve Karakter Testi</h1>
      <p class="sub">Dürüst ol, yapay zeka şu an nabzını ölçüyor...</p>

      <div class="buttons">
        <button class="choice btn-green" onclick="pick('green')">Ben Aslında Çok Zekiyim</button>
        <button class="choice btn-red" onclick="pick('red')">Ben Tam Bir Efsaneyim</button>
      </div>
    </div>

    <div class="result" id="result">
      <div class="badge" id="badge"></div>
      <div class="result-text" id="resultText"></div>
      <div class="sub-roast" id="subRoast"></div>
      <button class="back" id="backBtn" onclick="tryBack()">Pişman Oldum, Geri Dön</button>
    </div>
  </div>

  <script>
    const menu = document.getElementById("menu");
    const result = document.getElementById("result");
    const badge = document.getElementById("badge");
    const resultText = document.getElementById("resultText");
    const subRoast = document.getElementById("subRoast");
    const backBtn = document.getElementById("backBtn");
    let dodgeCount = 0;

    function pick(side) {
      menu.style.display = "none";
      result.style.display = "block";
      dodgeCount = 0;
      backBtn.style.transform = "translate(0, 0)";
      backBtn.textContent = "Pişman Oldum, Geri Dön";

      if (side === "green") {
        badge.textContent = "SİSTEM TESPİTİ: BOŞ ÖZGÜVEN";
        badge.style.background = "rgba(22, 163, 74, 0.2)";
        badge.style.color = "#4ade80";
        resultText.textContent = "Tebrikler! Sırf yeşil diye bastığın bu buton, IQ seviyeni tost makinesiyle eşitledi.";
        subRoast.textContent = "Not: İtiraz etme, ekran görüntüsü alıp tüm mahalleye yaydık bile.";
      } else {
        badge.textContent = "SİSTEM TESPİTİ: AĞIR VAKA";
        badge.style.background = "rgba(220, 38, 38, 0.2)";
        badge.style.color = "#f87171";
        resultText.textContent = "Efsane falan değilsin kardeşim, sadece kırmızı görünce kendini tutamayan bir sazanmışsın.";
        subRoast.textContent = "Not: Bu kadar kolay oltaya gelmen bilim dünyasını bile şaşırttı.";
      }
    }

    function tryBack() {
      if (dodgeCount < 2) {
        dodgeCount++;
        const x = dodgeCount === 1 ? 55 : -55;
        const y = dodgeCount === 1 ? -15 : 15;
        backBtn.style.transform = `translate(${x}px, ${y}px)`;
        backBtn.textContent = dodgeCount === 1 ? "Hop, nereye kaçıyorsun?" : "Son bir şans daha...";
      } else {
        result.style.display = "none";
        menu.style.display = "block";
      }
    }
  </script>
</body>
</html>
